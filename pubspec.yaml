name: halaaiarabic
description: "Hala AI Learning Arabic - Dialect Speaking & Learning Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_generative_ai: ^0.4.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  google_mobile_ads: ^5.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  confetti: ^0.8.0
  intl: ^0.19.0
  audioplayers: ^6.7.1
  http: ^1.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/app_logo.jpg
    - assets/images/app_logo.png
    - assets/images/
    - assets/avatars/
